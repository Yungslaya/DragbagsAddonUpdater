name: CurseForge uploads
on:
  workflow_dispatch:
    inputs:
      addon:
        description: Reviewed addon release
        type: choice
        options:
          - MarketLedger
          - ProfessionPal
        required: true
      publish:
        description: Upload to CurseForge (otherwise validate only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: curseforge-uploads
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683af # v4.2.2
        with:
          persist-credentials: false
      - name: Validate or upload reviewed release
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          ADDON: ${{ inputs.addon }}
          PUBLISH: ${{ inputs.publish }}
        run: python3 publishing/curseforge_upload.py
